<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Sign in to Vision API." />
    <title>Sign in — Vision API</title>
    <link rel="icon" href="assets/brand-mark.png" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body class="auth-body">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="auth-header shell">
      <a class="brand" href="index.html" aria-label="Vision API home">
        <img src="assets/brand-mark.png" alt="" width="42" height="42" />
        <span>Vision API</span>
      </a>
      <a class="text-link" href="index.html"><span aria-hidden="true">←</span> Back to home</a>
    </header>
    <main id="main" class="auth-main">
      <section class="auth-panel" aria-labelledby="sign-in-title">
        <h1 id="sign-in-title">Welcome back</h1>
        <p class="auth-intro">Sign in to continue to your workspace.</p>
        <form class="auth-form" data-local-form="sign-in" action="#" method="get" novalidate>
          <div class="field">
            <label for="signin-email">Work email</label>
            <input id="signin-email" type="email" autocomplete="email" placeholder="name@company.com" required />
          </div>
          <div class="field">
            <label for="signin-password">Password</label>
            <div class="password-field">
              <input id="signin-password" type="password" autocomplete="current-password" minlength="8" required />
              <button class="password-toggle" type="button" data-password-toggle="signin-password" aria-label="Show password">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" /><circle cx="12" cy="12" r="2.5" /></svg>
              </button>
            </div>
          </div>
          <div class="form-options">
            <label class="check"><input type="checkbox" /> <span>Remember me</span></label>
            <button class="link-button" type="button" data-local-message="Password recovery is not connected in this local build.">Forgot password?</button>
          </div>
          <button class="button button-wide" type="submit">Sign in</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
        <p class="auth-switch">New to Vision API? <a href="register.html">Create account</a></p>
      </section>
    </main>
    <footer class="auth-footer">Vision API 20260726-01</footer>
  </body>
</html>
